name: data
# Elke ochtend: verse kaartencatalogus (TCGdex) en de prijslijst van Cardmarket naar de branch "data".
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build/**", ".github/workflows/**", "web/**", "app/**", "kaartpricer.py"]
permissions:
  contents: write
concurrency: data
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Vorige data ophalen (reserve als een download mislukt)
        run: |
          mkdir -p /tmp/prev
          if git fetch -q --depth 1 origin data; then git archive origin/data | tar -x -C /tmp/prev; fi
      - name: Kaartencatalogus bouwen
        run: |
          git clone -q --depth 1 https://github.com/tcgdex/cards-database.git /tmp/tcgdex
          bun build/export.ts /tmp/tcgdex /tmp/catalog.json
      - name: Cardmarket bestanden downloaden
        run: |
          B=https://downloads.s3.cardmarket.com/productCatalog
          curl -fsSL --retry 3 -o /tmp/prices.json  "$B/priceGuide/price_guide_6.json"        || rm -f /tmp/prices.json
          curl -fsSL --retry 3 -o /tmp/products.json "$B/productList/products_singles_6.json" || rm -f /tmp/products.json
          curl -fsSL --retry 3 -o /tmp/datas.json https://assets.tcgdex.net/datas.json || rm -f /tmp/datas.json
          ls -la /tmp/*.json
      - name: Compacte bestanden maken
        run: python3 build/build_data.py /tmp/catalog.json /tmp/prices.json /tmp/products.json /tmp/prev /tmp/out /tmp/datas.json
      - name: Publiceren op branch data (zonder geschiedenis, zodat de repo klein blijft)
        run: |
          cd /tmp/out
          git init -q -b data
          git add -A
          git -c user.name=kaartpricer -c user.email=kaartpricer@users.noreply.github.com commit -q -m "data $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
      - name: Losse app bouwen en publiceren op branch site (Cloudflare Pages)
        run: |
          mkdir -p ~/kaartpricer
          python3 - <<'PY'
          import gzip, os, shutil
          home = os.path.expanduser("~/kaartpricer")
          for name in ("catalog", "prices", "products", "images"):
              src = f"/tmp/out/{name}.json.gz"
              if os.path.exists(src):
                  open(f"{home}/{name}.json", "wb").write(gzip.decompress(open(src, "rb").read()))
          shutil.copy("/tmp/out/meta.json", f"{home}/meta.json")
          PY
          mkdir -p /tmp/appdata && python3 build/app_data.py /tmp/appdata
          if [ -f web/seed.json ]; then cp web/seed.json /tmp/appdata/; fi
          python3 build/web_build.py /tmp/site /tmp/appdata
          cd /tmp/site
          git init -q -b site
          git add -A
          git -c user.name=kaartpricer -c user.email=kaartpricer@users.noreply.github.com commit -q -m "site $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
