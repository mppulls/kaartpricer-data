<title>MP Kaartscan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: één kolom met de nieuwste scan bovenaan, een vaste kop met totalen en bod percentage,
   en een vaste scanbalk onderin. De holo ring om de scanknop is het enige uitgesproken accent. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --surface-2: #e9ecf2;
  --ink: #11141b;
  --muted: #5b6475;
  --line: #dfe3ea;
  --accent: #2a43e6;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaff;
  --ok: #0d7a53;
  --warn: #9a5200;
  --warn-soft: #fff1dc;
  --bad: #b8301a;
  --bad-soft: #fde9e6;
  --new: #e6eaff;
  --shade: rgba(17, 20, 27, .45);
  --shadow: 0 1px 2px rgba(17, 20, 27, .06), 0 6px 20px rgba(17, 20, 27, .07);
  --f-ui: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-code: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f14; --surface: #161a22; --surface-2: #1e232d; --ink: #edf0f5; --muted: #98a2b3; --line: #262c37;
    --accent: #8697ff; --accent-ink: #0d0f14; --accent-soft: #1d2442; --ok: #3cc98f; --warn: #f1a640; --warn-soft: #2b2112;
    --bad: #ff7a63; --bad-soft: #2d1714; --new: #1d2442; --shade: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d0f14; --surface: #161a22; --surface-2: #1e232d; --ink: #edf0f5; --muted: #98a2b3; --line: #262c37;
  --accent: #8697ff; --accent-ink: #0d0f14; --accent-soft: #1d2442; --ok: #3cc98f; --warn: #f1a640; --warn-soft: #2b2112;
  --bad: #ff7a63; --bad-soft: #2d1714; --new: #1d2442; --shade: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 20px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.num { font-variant-numeric: tabular-nums; }
.code { font-family: var(--f-code); font-size: 12px; letter-spacing: .02em; }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* kop: lijstnaam, één bedrag en alleen de knoppen die er nu toe doen */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); }
.top .wrap { padding-block: 8px 12px; display: grid; gap: 10px; }
.row1 { display: flex; align-items: center; gap: 4px; }
.listbtn { display: flex; align-items: center; gap: 4px; min-width: 0; font-weight: 600; font-size: 16px; color: var(--muted); }
.listbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listbtn svg { flex: none; }
.spacer { flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.iconbtn:active { background: var(--surface-2); }
.sum { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.sumleft { display: grid; gap: 2px; }
.sumleft b { font-size: 32px; font-weight: 700; letter-spacing: -.025em; line-height: 1.05; }
.pctbtn { justify-self: start; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pctbtn span { color: var(--accent); }
.sumright { display: grid; gap: 2px; text-align: right; font-size: 13px; color: var(--muted); padding-bottom: 3px; }
.sumright b { color: var(--ink); font-weight: 600; }
.pctrow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.pctrow::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pctin { flex: none; width: 76px; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); text-align: center; font-weight: 600; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.fchip { flex: none; height: 30px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--ink); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 5px; }
.fchip.warn { color: var(--warn); border-color: transparent; background: var(--warn-soft); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* feed */
main .wrap { padding-block: 4px 16px; display: grid; gap: 12px; }
.notice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; font-size: 14px; color: var(--muted); }
.notice b { color: var(--ink); }
.empty { text-align: center; padding: 56px 12px 24px; display: grid; gap: 8px; justify-items: center; }
.empty h2 { margin: 0; font-size: 20px; text-wrap: balance; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.ghostgrid { display: grid; grid-template-columns: repeat(3, 34px); gap: 6px; margin-bottom: 8px; }
.ghostgrid i { height: 46px; border-radius: 5px; border: 1.5px dashed var(--line); }
.scan { background: var(--surface); border-radius: var(--r); overflow: hidden; box-shadow: 0 1px 2px rgba(17, 20, 27, .05); }
.scanhead { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 14px; min-height: 40px; }
.scanhead .cap { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.scanhead .iconbtn { width: 34px; height: 34px; color: var(--muted); }
.daycard .scanhead, .buyhead { padding: 12px 14px; }
.buyhead .t { flex: 1; min-width: 0; } .buyhead .t b { display: block; font-size: 15px; } .buyhead .t small { color: var(--muted); font-size: 12px; }
.pill { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); }
.pill.busy { background: var(--accent-soft); color: var(--accent); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.linkbtn { color: var(--accent); font-weight: 600; font-size: 13px; padding: 4px 2px; }

.card { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 14px; position: relative; background: var(--surface); touch-action: pan-y; }
.swipe { position: relative; background: var(--bad); border-top: 1px solid var(--line); overflow: hidden; }
.scanhead + .swipe { border-top: 0; }
.swipe-lbl { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #fff; font-weight: 700; font-size: 14px; opacity: .55; transition: opacity .15s; }
.swipe.armed .swipe-lbl { opacity: 1; }
.errrow { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-top: 1px solid var(--line); }
.card.check::before, .card.none::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--warn); }
.card.none::before { background: var(--bad); }
.card.fresh { animation: fresh 2.4s ease-out; }
@keyframes fresh { 0% { background: var(--new); } 100% { background: var(--surface); } }
.thumb { width: 40px; height: 56px; border-radius: 4px; object-fit: cover; background: var(--surface-2); display: block; }
.info { min-width: 0; }
.info b { display: block; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info .sub { display: flex; gap: 6px; align-items: baseline; color: var(--muted); font-size: 12.5px; margin-top: 3px; white-space: nowrap; overflow: hidden; }
.info .sub .warn { color: var(--warn); font-weight: 600; } .info .sub .bad { color: var(--bad); font-weight: 600; } .info .sub .rev, .pctt { color: var(--accent); font-weight: 600; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.rev { background: var(--accent-soft); color: var(--accent); }
.price { text-align: right; white-space: nowrap; }
.price b { display: block; font-size: 16px; font-weight: 700; }
.price small { color: var(--muted); font-size: 12px; }
.price small.own { color: var(--accent); font-weight: 600; }
.skel { height: 56px; margin: 10px 12px; border-radius: 8px; background: linear-gradient(90deg, var(--surface-2), var(--bg), var(--surface-2)); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }

.detail { grid-column: 1 / -1; display: grid; gap: 10px; padding-top: 4px; }
.detail .lbl, .sheet .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.alts { display: flex; flex-wrap: wrap; gap: 6px; }
.alt { padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; text-align: left; }
.alt .code { display: block; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { height: 38px; padding: 0 13px; border-radius: 11px; background: var(--surface-2); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; }
.btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.prices2 { display: grid; grid-template-columns: minmax(0, 1fr) 64px 44px; gap: 8px; align-items: start; }
.nextbtn { width: 44px; height: 40px; border-radius: 11px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.nextbtn:active { transform: scale(.95); }
.vers { display: grid; gap: 8px; justify-items: start; }
.own.pctown input { padding: 0 6px; text-align: center; }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.setrow .t { min-width: 0; } .setrow .t b { display: block; font-size: 14px; } .setrow .t small { display: block; color: var(--muted); font-size: 12px; }
.sheet .setrow { background: var(--bg); border: 0; }
.switch { flex: none; width: 48px; height: 29px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .15s; }
.switch i { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"] i { transform: translateX(19px); }
.openbtn { justify-self: end; color: var(--warn); font-weight: 600; font-size: 13px; padding: 0; }
.lowpill { height: 30px; padding: 0 13px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; }
.pctnote { display: flex; align-items: center; gap: 4px 10px; flex-wrap: wrap; }
.own { display: grid; gap: 4px; }
.own input { width: 100%; height: 40px; border-radius: 11px; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; font-weight: 600; font-size: 16px; }
.own .fine { font-size: 11px; }
.fine { font-size: 12px; color: var(--muted); }

/* scanbalk */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: linear-gradient(to top, var(--bg) 70%, transparent); padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); padding-top: 18px; }
.dock .wrap { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.side { justify-self: start; width: 52px; height: 52px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; color: var(--ink); }
.queue { justify-self: end; font-size: 12px; color: var(--muted); text-align: right; }
.fab { position: relative; width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center; isolation: isolate; }
.fab::before { content: ""; position: absolute; inset: 0; border-radius: 50%; z-index: -2;
  background: conic-gradient(from var(--spin, 0deg), #ff8a8a, #ffd36e, #8cf0b4, #77c6ff, #b59cff, #ff8ad8, #ff8a8a);
  animation: spin 6s linear infinite; }
.fab::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--ink); z-index: -1; }
.fab svg { color: var(--bg); }
.fab:active { transform: scale(.96); }
@property --spin { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
@keyframes spin { to { --spin: 360deg; } }
@media (prefers-reduced-motion: reduce) { .fab::before, .dot, .skel { animation: none; } .card.fresh { animation: none; } }

/* vellen */
.sheet { position: fixed; inset: 0; z-index: 20; display: grid; align-items: end; background: var(--shade); }
.sheet > div { background: var(--surface); border-radius: 20px 20px 0 0; max-height: 86vh; overflow: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 12px; max-width: 640px; width: 100%; margin: 0 auto; }
.sheet.top { align-items: start; }
.sheet.top > div { border-radius: 0 0 20px 20px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); max-height: 78vh; }
.sheet h3 { margin: 0; font-size: 17px; }
.sheet .item { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--bg); text-align: left; width: 100%; }
.sheet .item .t { flex: 1; min-width: 0; }
.sheet .item small { color: var(--muted); display: block; font-size: 12px; }
.sheet .item.on { outline: 2px solid var(--accent); }
.field { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(110px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.lowbtn { height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; gap: 5px; }
.buybtn { justify-self: end; height: 52px; padding: 0 16px; border-radius: 26px; background: var(--surface); box-shadow: var(--shadow); display: inline-grid; text-align: left; line-height: 1.15; }
.buybtn b { font-size: 14px; } .buybtn small { font-size: 12px; color: var(--muted); }
.buybtn:disabled { opacity: .45; }
.qpill { position: absolute; left: 50%; transform: translateX(-50%); top: -10px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.qpill:empty { display: none; }
.toast { display: flex; gap: 14px; align-items: center; width: max-content; }
.toast span { min-width: 0; }
.toastbtn { color: var(--accent-soft); font-weight: 700; white-space: nowrap; }
.sumgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sumgrid div { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.sumgrid small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.sumgrid b { font-size: 17px; }
.daycard { padding: 14px 12px; display: grid; gap: 12px; }
.daycard .big { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.buyhead { cursor: pointer; }
.buyrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); font-size: 14px; }
.buyrow img, .buyrow .ph { width: 34px; height: 48px; border-radius: 4px; object-fit: cover; background: var(--surface-2); }
.buyrow b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.buyrow small { color: var(--muted); font-size: 12px; }
.lowsheet { min-height: 70vh; }
.lowhead { display: flex; align-items: center; gap: 10px; }
.lowhead .prog { flex: 1; height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.lowhead .prog i { display: block; height: 100%; background: var(--accent); }
.lowcard { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center; }
.lowcard img, .lowcard .ph { width: 96px; height: 134px; border-radius: 7px; object-fit: cover; background: var(--surface-2); display: block; }
.lowcard b { font-size: 18px; display: block; }
.lowcard .fine { margin-top: 4px; }
.bigin { width: 100%; height: 58px; border-radius: 14px; border: 2px solid var(--line); background: var(--bg); padding: 0 16px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bigin:focus { border-color: var(--accent); outline: none; }
.btn.wide { width: 100%; height: 50px; justify-content: center; font-size: 16px; border-radius: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.sheet .item.srow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 6px; align-items: center; padding: 10px 10px 10px 12px; }
.sheet .item.srow.pick { grid-template-columns: minmax(0, 1fr) auto; }
.srow .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow .sp { text-align: right; } .srow .sp b { display: block; font-size: 15px; } .srow .sp small { color: var(--muted); font-size: 11px; }
.sbtn { background: var(--surface); width: 36px; height: 36px; color: var(--accent); }
.sbtn.add { background: var(--accent); color: var(--accent-ink); }
.cmp { display: flex; gap: 12px; }
.cmp figure { margin: 0; display: grid; gap: 4px; justify-items: start; }
.cmp img, .cmp .big { width: 120px; height: 168px; border-radius: 8px; object-fit: cover; background: var(--surface-2); display: block; }
.cmp figcaption { font-size: 11px; color: var(--muted); }
.alt.withimg { display: grid; grid-template-columns: 44px auto; gap: 8px; align-items: center; padding: 6px 10px 6px 6px; }
.altimg { width: 44px; height: 62px; border-radius: 4px; object-fit: cover; background: var(--surface-2); display: block; }
.sheet .item.srow:has(.sthumb) { grid-template-columns: 40px minmax(0, 1fr) auto auto auto; }
.sheet .item.srow.pick:has(.sthumb) { grid-template-columns: 40px minmax(0, 1fr) auto; }
.sthumb { width: 40px; height: 56px; border-radius: 4px; object-fit: cover; background: var(--surface-2); display: block; }
.cam { position: fixed; inset: 0; z-index: 40; background: #000; color: #fff; display: grid; grid-template-rows: 1fr auto; }
.cam video { width: 100%; height: 100%; object-fit: cover; grid-row: 1 / -1; grid-column: 1; }
.cam .guide { grid-row: 1; grid-column: 1; align-self: center; justify-self: center; position: relative; width: min(88vw, calc((100vh - 200px) * .78)); aspect-ratio: 3 / 3.85; border: 2px solid rgba(255,255,255,.9); border-radius: 10px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45);
  background-image: linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.35)), linear-gradient(rgba(255,255,255,.35), rgba(255,255,255,.35)), linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.35)), linear-gradient(90deg, rgba(255,255,255,.35), rgba(255,255,255,.35));
  background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%; background-position: 0 33.33%, 0 66.66%, 33.33% 0, 66.66% 0; background-repeat: no-repeat; }
.cam .hint { position: absolute; left: 0; right: 0; top: -34px; text-align: center; font-size: 14px; font-weight: 600; }

<script>
"use strict";
const SHEET_ID = "1A4MfpmtCSeFfYpSJ72w6lDzyk9Q35PNqxV0NBQ6-rfE";
const MONTHS = ["jan", "feb", "mrt", "apr", "mei", "jun", "jul", "aug", "sep", "okt", "nov", "dec"];
const EUR = new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" });
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cmLink = pid => `https://www.cardmarket.com/en/Pokemon/Products?idProduct=${pid}&sellerCountry=23&minCondition=2&language=1`;
const round2 = x => Math.round(x * 100) / 100;
const isNum = v => typeof v === "number" && Number.isFinite(v);
const parseMoney = v => { const n = parseFloat(String(v || "").replace(/[^\d,.]/g, "").replace(/\.(?=\d{3}(\D|$))/g, "").replace(",", ".")); return Number.isFinite(n) && n >= 0 ? round2(n) : null; };
const fmtDate = d => `${d.getDate()} ${MONTHS[d.getMonth()]}`;
const parseDate = s => new Date(String(s || "").replace(/([+-]\d\d)(\d\d)$/, "$1:$2"));
const fmtTime = t => { const d = new Date(t); return d.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" }); };

/* ---------------------------------------------------------------- catalogus */
const CAT = { ready: false, cards: [], byLocal: new Map(), byName: new Map(), byKey: new Map(), sets: [] };
const PR = { datum: null, p: {} };
const PLAIN = new Set(["", "common", "uncommon", "rare", "holo rare", "double rare", "holo rare v", "holo rare vmax", "holo rare vstar", "none", "rare holo", "amazing rare", "radiant rare", "ace spec rare", "rare holo ex", "rare holo gx", "rare holo lv.x"]);
const LABELS = new Set(["ultra", "rare", "attack", "full", "art", "alt", "sir", "ir", "hyper", "gold", "secret", "illustration", "special", "holo", "reverse", "promo"]);
const SUF = new Set(["ex", "gx", "v", "vmax", "vstar", "break", "lv", "x", "star"]);

function norm(s) {
  return String(s || "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[’']s\b/g, "")
    .replace(/[^a-z0-9 ]+/g, " ").split(" ").filter(Boolean);
}
function lev(a, b) {
  if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const sim = (a, b) => (a || b) ? 1 - lev(a, b) / Math.max(a.length, b.length) : 1;
function nameScore(q, c) {
  const Q = norm(q), C = norm(c);
  let qs = Q.filter(t => !SUF.has(t) && !LABELS.has(t)); if (!qs.length) qs = Q.filter(t => !SUF.has(t));
  const cs = C.filter(t => !SUF.has(t));
  if (!qs.length || !cs.length) return 0;
  const rc = cs.filter(t => Math.max(...qs.map(u => sim(t, u))) >= 0.72).length / cs.length;
  const rq = qs.filter(u => Math.max(...cs.map(t => sim(u, t))) >= 0.72).length / qs.length;
  return Math.max(sim(qs.join(""), cs.join("")), 0.6 * Math.max(rc, rq) + 0.4 * Math.min(rc, rq));
}
function parseNumber(num) {
  num = String(num || "").trim().toUpperCase().replace(/\s+/g, "");
  const [left = "", right = ""] = num.split("/");
  const m = /^([A-Z]*)0*(\d+)([A-Z]?)$/.exec(left);
  return { lid: m ? m[1] + m[2] + m[3] : left, total: /^\d+$/.test(right) ? parseInt(right, 10) : null };
}
async function loadData() {
  const [c, p] = await Promise.all([
    fetch("catalog.json", { cache: "no-cache" }).then(r => { if (!r.ok) throw new Error("catalogus"); return r.json(); }),
    fetch("prices.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : { datum: null, p: {} }).catch(() => ({ datum: null, p: {} })),
  ]);
  CAT.sets = c.sets.map(s => ({ id: s[0], name: s[1], code: s[2] || "", total: s[3] || 0, rel: s[4] || "", serie: s[5] || "", imgSet: s[6] || s[0] }));
  c.cards.forEach(r => {
    const set = CAT.sets[r[0]], rar = c.rarities[r[5]] || "", tok = norm(r[2]);
    const card = {
      sid: set.id, set, lid: r[1], name: r[2], hp: r[3] || 0, atk: new Set(String(r[4] || "").split("|").filter(Boolean).map(a => norm(a).join(" "))),
      rar, plain: PLAIN.has(rar.toLowerCase()), promo: /promo/i.test(rar) || /promo/i.test(set.name), pids: r[6] || [], imgf: r[7] || 0,
      nn: tok.join(" "), suf: tok.filter(t => SUF.has(t)).join(" "),
    };
    card.key = card.sid + "|" + card.lid;
    CAT.cards.push(card); CAT.byKey.set(card.key, card);
    const lk = parseNumber(card.lid).lid;
    if (!CAT.byLocal.has(lk)) CAT.byLocal.set(lk, []); CAT.byLocal.get(lk).push(card);
    if (!CAT.byName.has(card.nn)) CAT.byName.set(card.nn, []); CAT.byName.get(card.nn).push(card);
  });
  PR.datum = p.datum; PR.p = p.p || {};
  CAT.ready = true;
}
const IMG_ON = !!(window.KP && window.KP.img);
const STANDALONE = !!(window.KP && window.KP.standalone);
function imgOf(card) {
  if (!IMG_ON || !card || !card.imgf || !card.set.serie) return null;
  return `/img/${card.set.serie}/${card.imgf === 2 ? card.set.imgSet : card.set.id}/${encodeURIComponent(card.lid)}.webp`;
}
const refImg = (card, cls = "thumb") => { const u = imgOf(card); return u ? `<img class="${cls}" src="${u}" alt="" loading="lazy" data-ref="1">` : ""; };
document.addEventListener("error", e => { const t = e.target; if (t && t.tagName === "IMG" && t.dataset && t.dataset.ref) { const ph = document.createElement("span"); ph.className = t.className; t.replaceWith(ph); } }, true);
function pidOf(card) { if (!card) return null; return card.pids.find(p => PR.p[p]) || card.pids[0] || null; }
function trendOf(card, rev) {
  const pid = pidOf(card); const v = pid && PR.p[pid]; if (!v) return null;
  const x = rev ? v[1] : v[0]; return (typeof x === "number" && x > 0) ? x : null;
}
const codeOf = card => card.set.code || card.set.id;
function numOf(card, read) {
  const left = String(read || "").toUpperCase().replace(/\s+/g, "").split("/")[0];
  if (left && parseNumber(left).lid === parseNumber(card.lid).lid) return left;
  return /^\d+$/.test(card.lid) && card.set.rel >= "2020" ? card.lid.padStart(3, "0") : card.lid;
}

/* ---------------------------------------------------------------- herkennen */
function decide(name, number, code) {
  const { lid, total } = parseNumber(number); const out = [];
  for (const c of CAT.byLocal.get(lid) || []) {
    const ns = name ? nameScore(name, c.name) : 0.5; let score = ns, anchored = false;
    if (total != null) { if (c.set.total === total) { score += 0.5; anchored = true; } else score -= 0.35; }
    if (code && c.set.code && code.toUpperCase() === c.set.code.toUpperCase()) { score += 0.6; anchored = true; }
    if (ns >= 0.4 || (code && anchored)) out.push({ score, ns, anchored, c });
  }
  out.sort((a, b) => b.score - a.score);
  if (!out.length) return null;
  const best = out[0], alts = out.slice(1, 8).map(x => x.c);
  if (out[1] && best.score - out[1].score < 0.15) return { st: "check", card: best.c, alts };
  if ((best.anchored && best.ns >= 0.55) || (!best.anchored && best.ns >= 0.85)) return { st: "ok", card: best.c, alts: [] };
  return { st: "check", card: best.c, alts };
}
function byName(name, hp, attacks) {
  const tok = norm(name), nn = tok.join(" "), suf = tok.filter(t => SUF.has(t)).join(" ");
  let r = CAT.byName.get(nn) || [];
  if (!r.length) r = CAT.cards.filter(c => c.suf === suf && nameScore(name, c.name) >= 0.8);
  if (hp) { const f = r.filter(c => !c.hp || c.hp === Number(hp)); if (f.length) r = f; }
  if (attacks && attacks.length) {
    const A = attacks.map(a => norm(a).join(" ")).filter(Boolean);
    const f = r.filter(c => A.some(a => c.atk.has(a))); if (f.length) r = f;
  }
  return r;
}
function stickerValue(s) {
  const m = /(\d+(?:[.,]\d{1,2})?)/.exec(String(s || "")); if (!m) return null;
  const v = parseFloat(m[1].replace(",", ".")); return v > 0 && v < 100000 ? v : null;
}
function identify(r) {
  const lang = String(r.lang || "en").toLowerCase();
  if (!CAT.ready) return { st: "none" };
  if (!["en", "eng", "english"].includes(lang)) return { st: "none", lang: lang.toUpperCase() };
  const code = String(r.set || "").toUpperCase().replace(/\s*EN$/, "").trim();
  let d = null;
  if (r.number) { d = decide(r.name, r.number, code); if (d && d.st === "ok") return d; }
  let c = r.name ? byName(r.name, r.hp, r.attacks) : [];
  if (!c.length) return d || { st: "none" };
  const { total } = parseNumber(r.number);
  if (code) { const f = c.filter(x => x.set.code.toUpperCase() === code); if (f.length) c = f; }
  if (total) { const f = c.filter(x => x.set.total === total); if (f.length) c = f; }
  if (r.art && c.length > 1) {
    const f = r.art === "full" ? c.filter(x => !x.plain) : c.filter(x => x.plain || x.promo);
    if (f.length) c = f;
  }
  if (c.length === 1) return { st: "ok", card: c[0], alts: [] };
  c = [...c].sort((a, b) => (b.set.rel || "").localeCompare(a.set.rel || ""));
  let pick = c[0]; const sv = stickerValue(r.sticker);
  if (sv) {
    let best = Infinity;
    for (const x of c) { const t = trendOf(x, false); if (t) { const dd = Math.abs(Math.log(t / sv)); if (dd < best) { best = dd; pick = x; } } }
  }
  return { st: "check", card: pick, alts: c.filter(x => x !== pick).slice(0, 8) };
}
function applyId(k, res) {
  k.st = res.st; k.sid = res.card ? res.card.sid : null; k.lid = res.card ? res.card.lid : null;
  k.alts = (res.alts || []).map(a => [a.sid, a.lid]); if (res.lang) k.lang = res.lang;
}

/* ---------------------------------------------------------------- beelden */
async function toBitmap(file) {
  try { return await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    const url = URL.createObjectURL(file);
    try { const img = new Image(); img.src = url; await img.decode(); return await createImageBitmap(img); }
    finally { URL.revokeObjectURL(url); }
  }
}
function canvasOf(w, h) { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; }
function toBlob(c, q) { return new Promise(res => c.toBlob(res, "image/jpeg", q)); }
async function scaled(bm, maxPixels, q) {
  const s = Math.min(1, Math.sqrt(maxPixels / (bm.width * bm.height)));
  const c = canvasOf(bm.width * s, bm.height * s); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height); return toBlob(c, q);
}
function boxPx(bm, box, pad, dim) {
  if (!Array.isArray(box) || box.length < 4) return null;
  let [x0, y0, x1, y1] = box.map(Number);
  if (![x0, y0, x1, y1].every(Number.isFinite)) return null;
  if (Math.max(x0, y0, x1, y1) > 1.5) {            // pixels van de verstuurde foto of promille
    const [W, H] = dim || [1000, 1000];
    x0 /= W; x1 /= W; y0 /= H; y1 /= H;
  }
  const w = x1 - x0, h = y1 - y0; if (w <= 0 || h <= 0) return null;
  x0 = Math.max(0, x0 - w * pad); x1 = Math.min(1, x1 + w * pad); y0 = Math.max(0, y0 - h * pad); y1 = Math.min(1, y1 + h * pad);

}
function cropCanvas(bm, box, pad, maxSide, dim) {
  const p = boxPx(bm, box, pad, dim); if (!p) return null;

}

  const c = canvasOf(64, 90), g = c.getContext("2d"); const s = Math.max(64 / p[2], 90 / p[3]);
  const w = 64 / s, h = 90 / s; g.drawImage(bm, p[0] + (p[2] - w) / 2, p[1] + (p[3] - h) / 2, w, h, 0, 0, 64, 90);
  return c.toDataURL("image/jpeg", 0.62);
}
function photoThumb(bm) { const s = 96 / Math.max(bm.width, bm.height); const c = canvasOf(bm.width * s, bm.height * s); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", 0.6); }

/* ---------------------------------------------------------------- opslag */
const S = { db: null, sample: null, mcp: null, limits: null, lists: [], listId: null, scans: new Map(), live: new Map(),
  filter: "all", open: null, fresh: new Set(), queue: [], running: 0, bitmaps: new Map(), unsubScans: null, local: false,
  buys: [], unsubBuys: null, openBuy: null };
const listOf = () => S.lists.find(l => l.id === S.listId) || null;
/* wie gebruikt deze telefoon: iedereen eigen lijsten, inkopen en afronden; lijsten zonder eigenaar zijn van iedereen */
const ME = { name: (() => { try { return localStorage.getItem("kaartscan.wie") || ""; } catch { return ""; } })() };
const NAMES = ["Mees", "Plien"];
const mine = l => !l.door || !ME.name || l.door === ME.name;
const ownerOf = l => l && l.door && l.door !== ME.name ? l.door : "";
function pickDefaultList() {
  let want = null; try { want = localStorage.getItem("kaartscan.list"); } catch {}
  const w = S.lists.find(l => l.id === want);
  return (w && mine(w) ? w : null) || S.lists.find(l => ME.name && l.door === ME.name) || S.lists.find(mine) || null;
}
function setMe(name) {
  ME.name = name; try { localStorage.setItem("kaartscan.wie", name); } catch {}
  const l = listOf(); if (l && !mine(l)) { const p = pickDefaultList(); if (p) selectList(p.id); else clearSelection(); }
  else if (!l) { const p = pickDefaultList(); if (p) selectList(p.id); }

}

}
function openWho(then) {
  const known = [...new Set([...NAMES, ...S.lists.map(l => l.door).filter(Boolean)])];
  const sh = sheet(`<h3>Wie gebruikt deze telefoon?</h3>
    <p class="fine" style="margin:0">Iedereen heeft eigen lijsten, inkopen en dag afronden. Elkaars lijsten kun je wel openen via Lijsten.</p>
    <div class="chips">${known.map(n => `<button class="chip" data-who="${esc(n)}" aria-pressed="${n === ME.name}">${esc(n)}</button>`).join("")}</div>
    <div class="row"><input class="field" id="whoIn" placeholder="Andere naam" autocomplete="off" style="flex:1;min-width:0"><button class="btn" data-who-in="1">Kies</button></div>`,
    (e, close) => {

const STEP1 = `You are reading a phone photo of Pokémon trading cards: usually one binder page in a 3x3 grid, sometimes loose cards on a table.

{"box":[x0,y0,x1,y1],"name":"Mew ex","hp":180,"attacks":["Restart","Genome Hacking"],"set":null,"number":null,"art":"full","lang":"en","sticker":null}
box: the card outline as fractions (0 to 1) of the photo width and height.
name: exactly as printed, with ex, V, VMAX, VSTAR, GX and owner prefixes such as N's, Misty's or Team Rocket's. Trainers and energy: the card title.
hp: the number, or null. attacks: up to two ability or attack names as printed.
set and number: the set code and card number from the bottom left print line (like "MEW" and "205/165", or "SVP" and "053"), only if you can really read them, else null. Never guess.

const STEP2 = `Each image is one Pokémon card. Read only the small print line at the bottom left of the card: the set code (letters such as MEW, PAF, SVP, MEP, JTG, often followed by EN) and the card number (like 205/165, TG13/TG30, SWSH291 or 053).

}

}

function errText(e) {

async function runJob(job) {

    const f1 = Math.min(1, Math.sqrt(1150000 / (bm.width * bm.height))); s.dim = [Math.round(bm.width * f1), Math.round(bm.height * f1)];
    const blob = await scaled(bm, 1150000, 0.86);

      const r = parseLine(line); if (!r || !(r.name || r.box)) return;
      const k = { k: uid(), box: Array.isArray(r.box) ? r.box : null, lez: { name: r.name || "", hp: r.hp || null, attacks: Array.isArray(r.attacks) ? r.attacks.slice(0, 2) : [], set: r.set || null, number: r.number || null, art: r.art || null, lang: r.lang || "en", sticker: r.sticker || null }, rev: false, eigen: null };

async function readNumbers(s, bm, need, tier) {

const priceVal = k => isNum(k.eigen) ? k.eigen : isNum(k.low) ? k.low : null;   // één prijs per kaart (oude eigen prijs telt nog mee)

function searchCards(q) { const r = searchPass(q, false); return r.length ? r : searchPass(q, true); }
function wordHit(t, w, fuzzy) {
  if (t.startsWith(w)) return true;
  if (w.length > 3 && w.endsWith("s") && t.startsWith(w.slice(0, -1))) return true;     // lillies, rockets
  return fuzzy && w.length >= 4 && sim(t.slice(0, Math.max(w.length, t.length)), w) >= 0.75;
}
function searchPass(q, fuzzy) {
  const raw = String(q || "").toUpperCase(); let total = null;
  const m = /([A-Z]*\d+[A-Z]?)\s*\/\s*([A-Z]*\d+)/.exec(raw); if (m && /^\d+$/.test(m[2])) total = parseInt(m[2], 10);
  const tok = norm(m ? raw.replace(m[0], " " + m[1] + " ") : raw); if (!tok.length) return [];
  const nums = tok.filter(t => /\d/.test(t) && !CAT.sets.some(st => (st.code || "").toLowerCase() === t)), words = tok.filter(t => !nums.includes(t));
  const res = [];
  for (const c of CAT.cards) {
    const nt = c.nn.split(" "), code = (c.set.code || "").toLowerCase(), sname = c.set.name.toLowerCase();
    let viaName = 0, ok = true;
    for (const w of words) {
      if (nt.some(t => wordHit(t, w, fuzzy))) viaName++;
      else if (code === w || sname.split(/\s+/).some(t => t.startsWith(w))) continue;
      else { ok = false; break; }
    }
    if (!ok) continue;
    if (nums.length && !nums.some(n => parseNumber(n).lid === parseNumber(c.lid).lid)) continue;
    if (total && c.set.total !== total) continue;
    if (!words.length && !nums.length) continue;
    const nameWords = words.filter(w => nt.some(t => wordHit(t, w, fuzzy))).join(" ");
    const score = (nameWords && c.nn === nameWords ? 6 : 0) + (words[0] && c.nn.startsWith(words[0]) ? 3 : 0) + viaName + (nums.length ? 2 : 0) + (nameWords ? 4 * sim(c.nn, nameWords) : 0);
    res.push([score, c]);
  }
  return res.sort((a, b) => b[0] - a[0] || (b[1].set.rel || "").localeCompare(a[1].set.rel || "")).slice(0, 50).map(x => x[1]);
}

const listBuys = () => S.buys.filter(b => !b.list || b.list === S.listId).sort((a, b) => b.t - a.t);

function activeCards() {
  const out = [];
  for (const s of allScans().slice().reverse()) for (const k of s.kaarten || []) {
    const p = priceOf(k, s);
    out.push({ pct: p.pct, naam: p.card ? p.card.name : (k.lez.name || "Onbekende kaart"), set: p.card ? p.card.set.name : "", code: p.card ? codeOf(p.card) : "",

      trend: p.trend ?? null, low: Number.isFinite(k.low) ? k.low : null, eigen: Number.isFinite(k.eigen) ? k.eigen : null,

function allocate(cards, paid) {        // betaald bedrag naar rato van de waarde per kaart, voor je administratie
  const known = cards.map(c => c.basis).filter(v => v > 0); const avg = known.length ? known.reduce((a, b) => a + b, 0) / known.length : 1;
  const w = cards.map(c => c.basis > 0 ? c.basis : avg); const sum = w.reduce((a, b) => a + b, 0) || 1;
  let total = 0; cards.forEach((c, i) => { c.inkoop = round2(paid * w[i] / sum); total += c.inkoop; });
  const diff = round2(paid - total); if (diff && cards.length) { let mi = 0; w.forEach((x, i) => { if (x > w[mi]) mi = i; }); cards[mi].inkoop = round2(cards[mi].inkoop + diff); }
}
async function putBuy(b) {

  else { S.buys = S.buys.filter(x => x.id !== b.id).concat([b]); saveLocal(); }
}

    trend: round2(cards.reduce((a, c) => a + (c.trend || 0), 0)), basis: round2(cards.reduce((a, c) => a + (c.basis || 0), 0)), kaarten: cards };

}
function buysHtml() {
  const buys = listBuys(); const list = listOf();
  if (!buys.length) return `<div class="empty"><h2>Nog geen inkopen</h2><p>Scan de kaarten, veeg weg wat je niet koopt en tik onderin op Inkoop. Hier zie je daarna al je inkopen van de dag.</p></div>`;
  const paid = buys.reduce((a, b) => a + (b.betaald || 0), 0), n = buys.reduce((a, b) => a + (b.n || 0), 0), tr = buys.reduce((a, b) => a + (b.trend || 0), 0);
  let h = `<section class="scan daycard"><div><small class="lbl">Uitgegeven</small><div class="big num">${EUR.format(paid)}</div></div>
    <div class="sumgrid"><div><small>Inkopen</small><b class="num">${buys.length}</b></div><div><small>Kaarten</small><b class="num">${n}</b></div>${listTrend() ? `<div><small>Trend</small><b class="num">${EUR.format(tr)}</b></div>` : `<div><small>Per kaart</small><b class="num">${EUR.format(n ? paid / n : 0)}</b></div>`}</div>
    <button class="btn primary wide" data-act="finish">Dag afronden en naar Sheet</button>
    ${list && list.afgerond ? `<p class="fine">Afgerond om ${fmtTime(list.afgerond)} en naar je sheet gestuurd. Komen er nog inkopen bij, rond dan opnieuw af.</p>` : ""}</section>`;
  for (const b of buys) {
    const open = S.openBuy === b.id;
    h += `<section class="scan"><div class="scanhead buyhead" data-act="buyopen" data-b="${b.id}" role="button" tabindex="0" aria-expanded="${open}">
      <div class="t"><b>Inkoop ${b.nr}${b.verkoper ? " · " + esc(b.verkoper) : ""}</b><small>${fmtTime(b.t)} · ${b.n} ${b.n === 1 ? "kaart" : "kaarten"}${b.via ? " · " + esc(b.via) : ""}</small></div>
      <div class="price"><b class="num">${EUR.format(b.betaald || 0)}</b>${listTrend() ? `<small class="num">trend ${EUR.format(b.trend || 0)}</small>` : ""}</div></div>`;
    if (open) {
      h += (b.kaarten || []).map(c => `<div class="buyrow">${c.thumb ? `<img src="${c.thumb}" alt="">` : (c.sid ? refImg(CAT.byKey.get(c.sid + "|" + c.lid), "ph") : "") || `<span class="ph"></span>`}
        <div style="min-width:0"><b>${esc(c.naam)}${c.rev ? " (reverse)" : ""}</b><small><span class="code">${esc(c.code)} ${esc(c.nr)}</span>${isNum(c.eigen) || isNum(c.low) ? " · prijs " + EUR.format(isNum(c.eigen) ? c.eigen : c.low) : listTrend() && c.trend ? " · trend " + EUR.format(c.trend) : ""}</small></div>
        <div class="price"><b class="num">${EUR.format(c.inkoop || 0)}</b><small>inkoop</small></div></div>`).join("");
      h += `<div class="errrow"><span class="fine">Inkoop per kaart is het betaalde bedrag verdeeld naar waarde.</span><button class="linkbtn" style="color:var(--bad)" data-act="buydelask" data-b="${b.id}">Verwijder</button></div><div id="bd-${b.id}" style="padding:0 12px 12px"></div>`;
    }
    h += `</section>`;

}
function dayRows() {
  const buys = listBuys().slice().reverse();
  const out = [["Inkoop", "Tijd", "Verkoper", "Betaald via", "Naam", "Set", "Nummer", "Trend", "Prijs", "Inkoopprijs", "Cardmarket (NL, NM)"]];
  for (const b of buys) for (const c of b.kaarten || [])
    out.push([b.nr, fmtTime(b.t), b.verkoper || "", b.via || "", c.naam + (c.rev ? " (reverse)" : ""), c.set ? `${c.set} (${c.code})` : "", c.nr ? "'" + c.nr : "",
      c.trend ?? "", isNum(c.eigen) ? c.eigen : (c.low ?? ""), c.inkoop ?? "", c.pid ? cmLink(c.pid) : ""]);
  out.push([]);
  out.push(["Inkoop", "Tijd", "Verkoper", "Betaald via", "Kaarten", "Trend totaal", "Betaald"]);
  for (const b of buys) out.push([b.nr, fmtTime(b.t), b.verkoper || "", b.via || "", b.n, b.trend || 0, b.betaald || 0]);
  out.push(["Totaal", "", "", "", buys.reduce((a, b) => a + (b.n || 0), 0), round2(buys.reduce((a, b) => a + (b.trend || 0), 0)), round2(buys.reduce((a, b) => a + (b.betaald || 0), 0))]);
  return out;
}
function openFinish() {

  sheet(`<h3>Dag afronden</h3>
    <div class="sumgrid"><div><small>Inkopen</small><b class="num">${buys.length}</b></div><div><small>Kaarten</small><b class="num">${n}</b></div><div><small>Uitgegeven</small><b class="num">${EUR.format(paid)}</b></div></div>
    ${left ? `<div class="notice"><b>Er staan nog ${left} kaarten in je lijst die niet zijn ingekocht.</b> Die gaan niet mee naar de sheet.</div>` : ""}
    <p class="fine">Er komt een nieuw tabblad in je Kaartpricer sheet met elke ingekochte kaart, de inkoopprijs per kaart en onderaan de totalen per inkoop.</p>

    async (e, close) => {

    });
}

/* vegen om te verwijderen */
let sw = null;
document.addEventListener("touchstart", e => {
  const card = e.target.closest(".swipe > .card");
  if (!card || e.touches.length !== 1 || card.querySelector(".detail") || e.target.closest("input, a, button")) { sw = null; return; }
  sw = { card, wrap: card.parentElement, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, on: false };
}, { passive: true });
document.addEventListener("touchmove", e => {
  if (!sw) return; const t = e.touches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    if (dx < -10 && Math.abs(dx) > Math.abs(dy) * 1.3) { sw.on = true; sw.card.style.transition = "none"; } else return;
  }
  e.preventDefault(); sw.dx = Math.min(0, dx); sw.card.style.transform = `translateX(${sw.dx}px)`;
  sw.wrap.classList.toggle("armed", -sw.dx > Math.min(110, sw.wrap.offsetWidth * 0.3));
}, { passive: false });
function endSwipe() {
  if (!sw) return; const s = sw; sw = null; if (!s.on) return;
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 350);
  s.card.style.transition = "transform .18s ease";
  if (-s.dx > Math.min(110, s.wrap.offsetWidth * 0.3)) { s.card.style.transform = "translateX(-105%)"; setTimeout(() => deleteCard(s.wrap.dataset.s, s.wrap.dataset.k), 170); }
  else { s.card.style.transform = ""; s.wrap.classList.remove("armed"); }
}
document.addEventListener("touchend", endSwipe); document.addEventListener("touchcancel", endSwipe);

/* exporteren */
function rows() {
  const mixed = overrides().any;     // met eigen % per foto of kaart komt er een kolom Bod % bij
  const out = [["Naam", "Set", "Nummer", "Trend", "Prijs", mixed ? "Bod" : `Bod ${pct()}%`, ...(mixed ? ["Bod %"] : []), "Cardmarket (NL, NM)"]];
  for (const s of allScans().slice().reverse()) for (const k of s.kaarten || []) {
    const { card, trend, bod, pct: p } = priceOf(k, s);
    out.push([card ? card.name + (k.rev ? " (reverse)" : "") : (k.lez.name || "?"), card ? `${card.set.name} (${codeOf(card)})` : "", card ? "'" + numOf(card, k.lez.number) : "",
      trend ?? "", priceVal(k) ?? "", bod ?? "", ...(mixed ? [p] : []), card && pidOf(card) ? cmLink(pidOf(card)) : ""]);
  }
  return out;
}
async function copyRows(data, done) {
  const txt = data.map(r => r.map(v => typeof v === "number" ? String(v).replace(".", ",") : String(v).replace(/^'/, "")).join("\t")).join("\n");
  try { await navigator.clipboard.writeText(txt); toast(done); }
  catch { sheet(`<h3>Kopieer</h3><textarea class="field" style="height:50vh;padding:10px" readonly>${esc(txt)}</textarea>`); }
}
const copyList = () => copyRows(rows(), "Lijst gekopieerd");
async function toSheet() {
  const data = rows(); if (data.length < 2) { toast("Nog geen kaarten om te versturen"); return; }
  const l = listOf(), who = (l && l.door) || ME.name;
  await sheetWrite((l ? l.naam : "Kaartscan") + (who ? " " + who : ""), data);
}
const colName = n => { let s = ""; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
async function sheetWrite(name, data) {
  if (!S.mcp) { toast("Google Sheets is niet beschikbaar in deze weergave"); return null; }
  const base = String(name).replace(/[\[\]*?:\/\\']/g, " ").slice(0, 80);
  const width = Math.max(...data.map(r => r.length));
  toast("Naar Google Sheet sturen…");
  let title = base;
  try {
    try { await S.mcp.callTool("Google Sheets", "update_spreadsheet", { spreadsheetId: SHEET_ID, requests: [{ addSheet: { properties: { title, index: 0 } } }] }); }
    catch (e) {
      if (e && e.code === "tool_error") { title = `${base} ${fmtTime(Date.now()).replace(":", ".")}`; await S.mcp.callTool("Google Sheets", "update_spreadsheet", { spreadsheetId: SHEET_ID, requests: [{ addSheet: { properties: { title, index: 0 } } }] }); }
      else throw e;
    }
    await S.mcp.callTool("Google Sheets", "update_values", { spreadsheetId: SHEET_ID, range: `'${title}'!A1:${colName(width)}${data.length}`, values: data.map(r => r.length ? r : [""]) });
    toast(`In je sheet gezet, tabblad ${title}`, 4500);
    return title;
  } catch (e) {
    const c = e && e.code;
    const msg = c === "needs_reauth" ? "Koppel Google Sheets opnieuw in claude.ai bij Instellingen, Connectors"
      : c === "server_not_connected" ? "Voeg Google Sheets toe in claude.ai bij Instellingen, Connectors"
      : c === "not_in_manifest" || c === "approval_required" ? "Google Sheets heeft nog geen toestemming voor deze pagina. Probeer opnieuw en sta het toe"
      : c === "server_unavailable" || c === "upstream_error" ? "Google Sheets reageert niet. Kijk in je sheet of het tabblad er al staat voor je het opnieuw probeert"
      : "Naar Google Sheet sturen mislukt" + (e && e.message ? ": " + String(e.message).slice(0, 120) : "");
    toast(msg, 6000);
    return null;
  }
}
let toastT = null;
function toast(msg, ms = 3200, action) {
  const h = $("#toastHost"); h.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${action ? `<button class="toastbtn" id="toastAct" type="button">${esc(action.label)}</button>` : ""}</div>`;
  if (action) $("#toastAct").addEventListener("click", () => { h.innerHTML = ""; action.fn(); });
  clearTimeout(toastT); toastT = setTimeout(() => { h.innerHTML = ""; }, ms);
}

/* ---------------------------------------------------------------- camera met kader (alleen in de losse app) */
async function openCam() {
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false }); }
  catch { toast("Camera niet beschikbaar, de gewone camera opent"); $("#pickCamera").click(); return; }
  const el = document.createElement("div"); el.className = "cam"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Camera");
  el.innerHTML = `<video playsinline autoplay muted></video><div class="guide"><div class="hint">Leg de pagina precies in het kader</div></div><div class="flash"></div>
    <div class="bar"><button class="x" type="button">Sluiten</button><button class="shut" type="button" aria-label="Foto maken"></button><button class="done" type="button">Klaar</button></div>`;
  document.body.appendChild(el);
  const video = $("video", el); video.srcObject = stream; await video.play().catch(() => {});
  let n = 0;
  const close = () => { stream.getTracks().forEach(t => t.stop()); el.remove(); };
  $(".x", el).addEventListener("click", close); $(".done", el).addEventListener("click", close);
  $(".shut", el).addEventListener("click", async () => {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
    const vr = video.getBoundingClientRect(), gr = $(".guide", el).getBoundingClientRect();
    const sc = Math.max(vr.width / vw, vr.height / vh), ox = (vr.width - vw * sc) / 2, oy = (vr.height - vh * sc) / 2, pad = 0.05;
    let w = gr.width / sc, h = gr.height / sc, x0 = (gr.left - vr.left - ox) / sc - w * pad, y0 = (gr.top - vr.top - oy) / sc - h * pad;
    w *= 1 + 2 * pad; h *= 1 + 2 * pad; x0 = Math.max(0, x0); y0 = Math.max(0, y0); w = Math.min(vw - x0, w); h = Math.min(vh - y0, h);
    const c = canvasOf(w, h); c.getContext("2d").drawImage(video, x0, y0, w, h, 0, 0, c.width, c.height);
    const fl = $(".flash", el); fl.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove("on")));
    const blob = await toBlob(c, 0.92); n++; $(".done", el).textContent = `Klaar (${n})`;
    addFiles([new File([blob], `scan-${Date.now()}.jpg`, { type: "image/jpeg" })]);
  });
}
if (STANDALONE && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) $(".fab").addEventListener("click", e => { e.preventDefault(); openCam(); });

async function importSeed() {
  if (!S.db) { toast("Opslag niet beschikbaar"); return; }
  const r = await fetch("/seed.json", { cache: "no-store" }).catch(() => null);
  if (!r || !r.ok) { toast("Er staat niets klaar om te importeren"); return; }
  if (!ME.name) { openWho(importSeed); return; }
  const j = await r.json(); let n = 0, skip = 0;
  const have = new Set(S.lists.map(l => l.id));        // al aanwezige lijsten niet overschrijven, ook niet als iemand anders nog eens importeert
  toast("Importeren…", 60000);
  for (const d of j.docs || []) {
    const parts = String(d.path).split("/"); if (have.has(parts[1])) { skip++; continue; }
    const data = parts.length === 2 ? { ...d.data, door: d.data.door || ME.name } : d.data;
    try { await S.db.doc(d.path).set(data); n++; } catch {}
  }
  toast(n ? `${n} onderdelen geïmporteerd als lijsten van ${ME.name}` : skip ? "Die lijsten staan er al" : "Niets geïmporteerd", 4000);
}

/* ---------------------------------------------------------------- start */
async function boot() {
  render();
  const cl = window.claude && typeof window.claude.use === "function" ? window.claude : null;
  const [db, sample, mcp] = await Promise.all([
    cl ? cl.use("db").catch(() => null) : null, cl ? cl.use("sample").catch(() => null) : null, cl ? cl.use("mcp").catch(() => null) : null,
    loadData().catch(() => { S.loadError = true; }),
  ]);
  S.db = db; S.sample = sample; S.mcp = mcp; S.boot = true;
  if (sample && sample.limits) S.limits = await sample.limits().catch(() => null);
  if (db) watchLists();
  else { S.local = true; loadLocal(); const l = pickDefaultList(); if (l) S.listId = l.id; }
  render();
  if (!ME.name && (db || STANDALONE)) setTimeout(() => { if (!ME.name && !$("#sheetHost").innerHTML) openWho(); }, 600);
}
boot();
